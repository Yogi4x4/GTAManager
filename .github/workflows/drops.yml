# GTA V Manager: Twitch Drops for GTA Online (idea 91; strict since 0.42, Mihai's variant 3).
# Only two sources are believed: Rockstar's own Twitch Drops page and the official weekly post (data/weekly.json). A drop is
# "on" only when one of them gives explicit dates ("between October 30 – November 1") and today is inside them. Reddit
# questions and news articles are no longer read (they made it say "on" when nothing was). If this is still wrong at the next
# real drop, the whole feature is removed. Run it by hand any time: Actions → Twitch Drops → Run workflow.
name: Twitch Drops
on:
  schedule:
    - cron: "23 */6 * * *"     # every 6 hours
    - cron: "53 17,19 * * 4"   # and twice on Thursdays (Rockstar's weekly update)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twitch-drops
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Look for Twitch Drops
        run: |
          python3 - <<'PY'
          import json, re, datetime, urllib.request, html, os
          UA = "GTAManager-drops/1.0 (GitHub Action; personal fan page)"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "*/*"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", "replace")
          now = datetime.datetime.now(datetime.timezone.utc)
          MONTHS = {m: i for i, m in enumerate(["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"], 1)}
          MON = r"(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.?"
          def mkdate(mon, day, ref, end):
              mi = MONTHS.get(mon[:3].lower())
              if not mi: return None
              y = ref.year + (1 if mi < ref.month - 6 else 0) - (1 if mi > ref.month + 6 else 0)
              try: return datetime.datetime(y, mi, int(day), 23 if end else 0, 59 if end else 0, tzinfo=datetime.timezone.utc)
              except ValueError: return None
          def range_of(s, ref):
              m = re.search(MON + r"\s+(\d{1,2})(?:st|nd|rd|th)?\s*(?:[-–—]|to|through|until)\s*(?:" + MON + r"\s+)?(\d{1,2})", s, re.I)
              if not m: return None, None
              a = mkdate(m.group(1), m.group(2), ref, False); b = mkdate(m.group(3) or m.group(1), m.group(4), ref, True)
              return (a, b) if a and b and b >= a else (None, None)
          def claim_of(s, ref):
              m = re.search(r"claim\w*[^.]{0,60}?(?:though|through|until|by|before)\s+(?:\w+day,?\s+)?" + MON + r"\s+(\d{1,2})", s, re.I)
              return mkdate(m.group(1), m.group(2), ref, True) if m else None
          def strip(h):   # Rockstar's page is built by scripts: the text is inside their JSON, so keep it and undo \u2013-style escapes
              h = re.sub(r"\\u([0-9a-fA-F]{4})", lambda m: chr(int(m.group(1), 16)), h).replace("\\n", " ").replace('\\"', '"')
              return re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"(?is)<style[^>]*>.*?</style>", " ", h))))
          out = {"active": False, "fetched": now.strftime("%Y-%m-%dT%H:%MZ"), "page": "https://www.rockstargames.com/gta-online/twitch-drops"}
          found = None
          # 1. Rockstar's page: only the sentences that talk about Twitch and give dates
          try:
              txt = strip(get(out["page"]))
              for m in re.finditer(r"[^.]{0,220}twitch[^.]{0,260}\.?", txt, re.I):
                  seg = m.group(0)
                  st, en = range_of(seg, now)
                  if en:
                      ctx = txt[max(0, m.start() - 300): m.end() + 300]
                      t = re.search(r"Claim (?:the )?([^.]{5,120}?)(?: Watch|\.|$)", ctx)
                      found = {"source": "rockstar", "title": ("Claim the " + t.group(1).strip()) if t else "Twitch Drops", "url": out["page"], "start": st, "until": en, "claim": claim_of(ctx, now)}
                      break
          except Exception as e:
              print("rockstar page failed:", e)
          # 2. the official weekly post: a line about Twitch Drops that gives its own dates
          if not found:
              try:
                  w = json.load(open("data/weekly.json"))
                  wp = datetime.datetime.fromisoformat((w.get("posted") or "").replace("Z", "+00:00")) if w.get("posted") else now
                  for s_ in w.get("sections", []):
                      for line in [s_.get("title", "")] + s_.get("items", []):
                          if re.search(r"twitch\s*drop", line, re.I):
                              st, en = range_of(line, wp)
                              if en:
                                  found = {"source": "weekly", "title": line[:140], "url": w.get("url", ""), "start": st, "until": en, "claim": claim_of(line, wp)}
                                  break
                      if found: break
              except Exception as e:
                  print("weekly failed:", e)
          if found:
              f = lambda d: d.strftime("%Y-%m-%dT%H:%MZ") if d else None
              out.update({"title": found["title"], "url": found["url"], "source": found["source"], "start": f(found["start"]), "until": f(found["until"]), "claim": f(found["claim"]),
                          "active": bool(found["start"] and found["start"] <= now <= found["until"]) or bool(not found["start"] and now <= found["until"])})
          out["checked"] = out["fetched"]
          os.makedirs("data", exist_ok=True)
          old = None
          try: old = json.load(open("data/drops.json"))
          except Exception: pass
          skip = ("fetched", "checked")
          same = old and {k: v for k, v in old.items() if k not in skip} == {k: v for k, v in out.items() if k not in skip}
          stale = not old or (now - datetime.datetime.fromisoformat((old.get("checked") or old.get("fetched") or "2000-01-01T00:00Z").replace("Z", "+00:00"))) > datetime.timedelta(hours=20)
          if not same or stale:
              json.dump(out, open("data/drops.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(out))
          PY
      - name: Save to the repository
        run: |
          if [ -n "$(git status --porcelain data/drops.json)" ]; then
            git config user.name "GTA Manager bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/drops.json
            git commit -m "Twitch Drops (GTA Manager)"
            git pull --rebase
            git push
          fi
